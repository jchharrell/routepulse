name: test
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests
        run: mvn -B test
      - name: Package
        run: mvn -B -DskipTests package
      - name: Runnable scenario smoke test
        run: java -cp target/classes dev.jaredharrell.routepulse.ScenarioComparison 42 60
